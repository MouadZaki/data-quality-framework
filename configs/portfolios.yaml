table_name: portfolios
description: Portfolio entities
tenant_column: organisation_id
is_shared_reference: false
checks:
  - name: portfolio_id_unique_per_org
    type: unique_key
    config:
      columns:
        - id
      group_by:
        - organisation_id
      severity: ERROR
    description: Portfolio IDs must be unique within each organisation
    enabled: true
  - name: portfolio_org_id_not_null
    type: null_check
    config:
      column: organisation_id
      severity: ERROR
    description: Ensure all portfolios have an organisation_id
    enabled: true
